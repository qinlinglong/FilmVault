name: Build and publish Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.1.24
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FILMVAULT_STORE_PASSWORD: ${{ secrets.FILMVAULT_STORE_PASSWORD }}
      FILMVAULT_KEY_PASSWORD: ${{ secrets.FILMVAULT_KEY_PASSWORD }}
      FILMVAULT_KEY_ALIAS: ${{ secrets.FILMVAULT_KEY_ALIAS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FILMVAULT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret: FILMVAULT_KEYSTORE_BASE64" >&2
            exit 1
          fi
          FILMVAULT_KEYSTORE_PATH="$RUNNER_TEMP/filmvault-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FILMVAULT_KEYSTORE_PATH"
          chmod 600 "$FILMVAULT_KEYSTORE_PATH"
          echo "FILMVAULT_KEYSTORE_PATH=$FILMVAULT_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        run: |
          if [ -z "$FILMVAULT_STORE_PASSWORD" ] || [ -z "$FILMVAULT_KEY_PASSWORD" ] || [ -z "$FILMVAULT_KEY_ALIAS" ]; then
            echo "Missing one or more FilmVault signing secrets" >&2
            exit 1
          fi
          keytool -list \
            -keystore "$FILMVAULT_KEYSTORE_PATH" \
            -storepass:env FILMVAULT_STORE_PASSWORD \
            -alias "$FILMVAULT_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          VERSION_NAME=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test "v$VERSION_NAME" = "$TAG"
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmVault-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "FilmVault $TAG" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            app-release.apk.sha256
